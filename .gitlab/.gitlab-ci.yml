stages:
    - test
    - analyze
    - publish

default:
    image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:35d40304542c8689331f8cab17c65926cdf48fe711e289321d71924b230a7d29

variables:
    OUTPUT_DIR: publish/$RUNTIME/

test:dotnet:
    stage: test
    script:
        - dotnet test tests/SteamCollectionDownloadSizeCalculatorTests.csproj -c Release --verbosity normal -f net10.0

analyze:sast:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/semgrep
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour

publish:dotnet:
    stage: publish
    parallel:
        matrix:
            - RUNTIME: ["linux-x64", "linux-arm64", "osx-x64", "osx-arm64", "win-x64", "win-arm64"]
    script:
        - dotnet publish src/SteamCollectionDownloadSizeCalculator.csproj -c Release -f net10.0 -r $RUNTIME -o $OUTPUT_DIR --nologo --self-contained
    artifacts:
        paths:
            - $OUTPUT_DIR
        expire_in: 1 hour
